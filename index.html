<!doctype html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>School Navigator | Конкурстық интерактивті демо</title><style>
:root{--navy:#142746;--blue:#2955b7;--bg:#f2f5fb;--line:#dfe5ef;--ink:#1b2b46;--muted:#60728b;--red:#be334a;--amber:#a86912;--green:#16805b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Segoe UI',Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}aside{position:fixed;top:0;bottom:0;left:0;width:265px;padding:24px 17px;background:var(--navy);color:white;overflow:auto}aside .logo{font-size:22px;font-weight:800}aside small{color:#aac3e5}nav{margin-top:26px}nav button{display:block;text-align:left;width:100%;color:#d6e3f8;background:transparent;border:0;padding:14px;border-radius:12px;margin:4px 0}nav button.active,nav button:hover{background:#31538c;color:white}.asidefoot{font-size:12px;margin-top:30px;color:#b7c7e0}main{margin-left:265px;padding:30px 36px;max-width:1680px}.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:15px;margin-bottom:22px}.top h1{margin:0 0 7px;font-size:29px}.sub{color:var(--muted);font-size:14px}.role{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.role button,.btn{border:1px solid var(--line);background:white;padding:11px 15px;border-radius:10px;color:var(--ink);font-weight:650}.role button.on,.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.danger{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:22px;margin-bottom:18px;box-shadow:0 2px 8px #0e28500a}.metric{font-size:34px;font-weight:800;margin:5px 0}.muted{color:var(--muted)}.small{font-size:13px}.pill{display:inline-block;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:750;background:#edf1fb;color:#365997}.pill.red{background:#fce8ed;color:var(--red)}.pill.green{background:#def6eb;color:var(--green)}.pill.amber{background:#fff1d7;color:var(--amber)}.bar{height:11px;background:#e9edf6;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--blue);transition:width .2s}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.doc{border:1px solid var(--line);border-radius:14px;padding:18px;margin:13px 0;background:#fff}.doc h3{margin:0 0 8px;font-size:18px}.item{padding:11px 0;border-bottom:1px solid #e8ecf4;display:flex;gap:9px;align-items:flex-start}.item:last-child{border-bottom:0}.item input{margin-top:5px;accent-color:var(--blue);width:17px;height:17px}.item label{flex:1}.item small{display:block;margin-top:3px;color:var(--muted)}.note{background:#f5f7fc;padding:13px;border-radius:10px;font-size:14px;margin:12px 0}.warn{background:#fff7e8;border:1px solid #efd9aa;padding:14px;border-radius:12px}.bad{background:#fff0f3;border:1px solid #f3cad2;padding:14px;border-radius:12px}.good{background:#eaf9f1;border:1px solid #c2ebd7;padding:14px;border-radius:12px}h2{font-size:20px;margin-top:0}.table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{border-bottom:1px solid var(--line);padding:12px 8px;text-align:left;vertical-align:top}.table th{color:#52647d;background:#f6f8fc}.field{display:block;margin:10px 0 5px;font-size:13px;font-weight:700}input[type=text],input[type=date],textarea,select{width:100%;border:1px solid #d7dfed;border-radius:9px;padding:10px 12px;background:white;color:var(--ink)}textarea{min-height:70px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.step{padding:9px 12px;border-radius:9px;background:#e8edfa;font-size:13px;color:#30549a}.step.current{background:var(--blue);color:white}.tag{font-weight:750;color:var(--blue)}.preview{border:1px solid #c9d5e7;border-radius:12px;padding:16px;background:#fcfdff}.preview table{width:100%;font-size:13px;border-collapse:collapse}.preview td,.preview th{border:1px solid #dbe2ed;padding:8px}.preview th{background:#f0f3fa}.hidden{display:none!important}.call{font-size:13px;color:#49617e;line-height:1.6}.toggle{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:10px;margin:7px 0;align-items:center}.focus{border-left:4px solid var(--blue);padding-left:15px}@media(max-width:1050px){aside{position:static;width:auto}main{margin:0;padding:18px}.grid,.two{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}nav button{width:auto}}

</style></head><body><aside><div class="logo">✦ School Navigator</div><small>Мектеп директорының басқару веб-тренажері</small><nav id="nav"></nav><div class="asidefoot">КОНКУРСТЫҚ ДЕМО • 2026<br>Барлық дерек — ойдан құрастырылған оқу үлгісі. Нақты мектептің ресми қорытындысы емес.</div></aside><main><div class="top"><div><h1 id="heading">Басқару панелі</h1><div class="sub">Мемлекеттік аттестаттауға дайындық • Бір модульдің толық басқару циклі</div></div><div class="role"><span class="small muted">Рөл:</span><button id="bDeputy" onclick="setRole('deputy')">Оқу ісі орынбасары</button><button id="bDirector" onclick="setRole('director')">Директор</button></div></div><div id="demoGuide" class="demo-guide noprint"></div><div id="content"></div></main><script>
const KEY='school_nav_konkurs_v2'; const initial=()=>({role:'deputy',page:'dashboard',selected:'plan',review:{plan:{checks:[true,true,false,false],note:'7А сыныбының апталық жүктемесі мен жоспардағы 1 сағат айырмашылық анықталды (оқу жағдаяты).',status:'issue'},schedule:{checks:[true,false,true,false],note:'7А сыныбы кестесінде бейсенбідегі электив сабақ көрсетілмеген; сейсенбіде пән сағаттарының сәйкестігін қайта тексеру керек (оқу жағдаяты).',status:'issue'}},tasks:{},history:[{text:'Үлгілік екі құжат енгізілді. Әдейі сәйкессіздіктер көрсетілді.',at:'Демо басталуы'}]});let s;try{s={...initial(),...JSON.parse(localStorage.getItem(KEY)||'null')}}catch{s=initial()}if(!s.review)s=initial();const docs={plan:{name:'Жұмыс оқу жоспары',short:'ЖОЖ',authority:'№500 үлгілік оқу жоспарлары, №348 МЖМБС: нақты редакциясымен салыстыру қажет',source:'6-қосымша, 4-бөлім: жұмыс оқу жоспарының МЖМБС пен үлгілік оқу жоспарына сәйкестігі',checks:['Жұмыс оқу жоспары бекітілген және тиісті кезеңге арналған','ЖОЖ құрылымы таңдалған үлгілік оқу жоспарының нұсқасымен салыстырылған','Апталық жүктеме есептері таңдалған нұсқаға сәйкес тексерілген','Сабақ кестесі мен ЖОЖ-дағы сағаттар салыстырылған'],rows:[['7А','Оқу жүктемесінің оқу-жағдаяттық үлгісі','34 сағ.','35 сағ.','+1 сағ. сәйкессіздік'],['7Б','Оқу жүктемесінің оқу-жағдаяттық үлгісі','34 сағ.','34 сағ.','Сәйкес']],issue:'7А сыныбында 1 сағаттық айырма бар. Бұл мәндер оқу-демонстрациялық деректер: нақты заңды лимит деп қабылдауға болмайды.',task:'7А сыныбының оқу жүктемесі бойынша есепті нақты жоспар нұсқасына сәйкес қайта салыстырып, түзетілген ЖОЖ бен түсіндірме жазбаны ұсыну.'},schedule:{name:'Сабақ кестесі',short:'Кесте',authority:'№348 МЖМБС, №500 үлгілік оқу жоспарлары; мектептегі бекітілген ЖОЖ',source:'6-қосымша, 4-бөлім: жұмыс оқу жоспары, сабақ кестесі; оқу жүктемесінің сәйкестігі',checks:['Оқу кезеңіне арналған сабақ кестесі бекітілген','Әр пәннің аптадағы сабақ саны ЖОЖ көрсеткішімен салыстырылған','Сыныптар мен пәндер бойынша деректерде техникалық қате жоқ','Кестеде қарастырылған барлық сабақ пен элективтер көрсетілген'],rows:[['7А','Қазақ тілі','3','3','Сәйкес'],['7А','Математика','5','5','Сәйкес'],['7А','Электив (оқу үлгісі)','1','0','–1 сағ. жетіспейді'],['7Б','Қазақ тілі','3','3','Сәйкес']],issue:'7А сыныбына қатысты электив сабақ кестеге енгізілмеген (демонстрациялық мысал).',task:'7А сыныбының электив сабағын кестеде нақтылап, ЖОЖ-пен толық сәйкестендірілген кесте мен өзгеріс негіздемесін ұсыну.'}};
const navs=[['dashboard','▦ Басқару панелі'],['documents','▤ Құжаттарды тексеру'],['route','☷ Маршруттық парақ'],['director','◎ Директор бақылауы'],['report','▣ Есеп және экспорт'],['guide','? Конкурста көрсету']];function save(){localStorage.setItem(KEY,JSON.stringify(s))}function log(t){s.history.unshift({text:t,at:new Date().toLocaleString('kk-KZ')})}function setPage(p){s.page=p;save();render()}function setRole(r){s.role=r;save();render()}function choose(d){s.selected=d;save();render()};function check(k,i,v){s.review[k].checks[i]=v;s.review[k].status='review';log(docs[k].short+': чек-парақ жаңартылды');save();render()}function setNote(k,v){s.review[k].note=v;save()}function review(k){let a=s.review[k];a.status=a.checks.every(Boolean)?'ready':'issue';log(docs[k].name+': тексеру — '+(a.status==='ready'?'барлық чек белгіленген':'сәйкессіздік бар'));save();render()}function taskCreate(k){if(s.role!=='director')return;const deadline=document.getElementById('date'+k).value;const content=document.getElementById('task'+k).value.trim();if(!deadline||!content){alert('Тапсырма мәтінін және мерзімін енгізіңіз.');return}s.tasks[k]={text:content,deadline,state:'assigned',comment:'',directorComment:''};log('Директор '+docs[k].name+' бойынша түзету тапсырмасын берді');save();render()}function submitFix(k){const t=s.tasks[k];if(!t||t.state!=='assigned')return;let note=document.getElementById('fix'+k).value.trim();if(!note){alert('Түзету туралы түсіндірме енгізіңіз.');return}t.state='submitted';t.comment=note;s.review[k].checks=docs[k].checks.map(()=>true);s.review[k].status='resubmitted';log('Орынбасар '+docs[k].name+' бойынша түзету дәлелдемесін ұсынды');save();render()}function decision(k,accept){const t=s.tasks[k];if(!t||t.state!=='submitted'||s.role!=='director')return;let reason=document.getElementById('decision'+k).value.trim();if(!reason){alert('Директордың тексеру қорытындысын енгізіңіз.');return}t.directorComment=reason;t.state=accept?'approved':'assigned';s.review[k].status=accept?'approved':'issue';if(!accept){s.review[k].checks[3]=false}log('Директор '+docs[k].name+': '+(accept?'қайта тексеруді мақұлдады':'қайта түзетуге жіберді'));save();render()}function reset(){if(confirm('Демо бастапқы жағдайға қайтарылсын ба?')){s=initial();save();render()}}function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};const stateLabel=k=>s.review[k].status==='approved'?'Директор бекітті':s.tasks[k]?.state==='submitted'?'Қайта тексеруді күтуде':s.tasks[k]?.state==='assigned'?'Түзету тапсырмасы берілді':s.review[k].status==='issue'?'Сәйкессіздік табылды':s.review[k].status==='ready'?'Орынбасар тексерді':'Тексерілуде';const badge=k=>{let c=s.review[k].status==='approved'?'green':s.tasks[k]?.state==='submitted'?'amber':s.review[k].status==='issue'?'red':'amber';return `<span class="pill ${c}">${stateLabel(k)}</span>`};const percent=()=>Math.round(Object.keys(docs).reduce((a,k)=>a+(s.review[k].status==='approved'?1:0),0)/2*100);function render(){document.getElementById('heading').textContent=Object.fromEntries(navs.map(([p,n])=>[p,n.slice(2)]))[s.page];document.getElementById('nav').innerHTML=navs.map(([k,n])=>`<button class="${s.page===k?'active':''}" onclick="setPage('${k}')">${n}</button>`).join('');document.getElementById('bDirector').classList.toggle('on',s.role==='director');document.getElementById('bDeputy').classList.toggle('on',s.role==='deputy');let o={dashboard:dashboard,documents:documents,route:route,director:director,report:report,guide:guide};document.getElementById('content').innerHTML=o[s.page]();}function dashboard(){let assigned=Object.values(s.tasks).filter(x=>x.state==='assigned').length, approved=Object.values(s.tasks).filter(x=>x.state==='approved').length;return `<div class="grid"><div class="card"><div class="muted">Директор бекіткен құжаттар</div><div class="metric">${percent()}%</div><div class="bar"><div class="fill" style="width:${percent()}%"></div></div></div><div class="card"><div class="muted">Түзетуге берілген тапсырма</div><div class="metric">${assigned}</div><span class="pill amber">Орындалуы бақыланады</span></div><div class="card"><div class="muted">Бекітілген түзету</div><div class="metric">${approved}</div><span class="pill green">Директор шешімі</span></div></div><div class="card"><h2>Құжаттар бойынша дайындық</h2><table class="table"><tr><th>Құжат</th><th>Мәртебе</th><th>Чек-парақ</th><th>Әрекет</th></tr>${Object.keys(docs).map(k=>`<tr><td><b>${docs[k].name}</b><div class="small muted">${docs[k].source}</div></td><td>${badge(k)}</td><td>${s.review[k].checks.filter(Boolean).length}/4</td><td><button class="btn" onclick="choose('${k}');setPage('documents')">Ашу →</button></td></tr>`).join('')}</table></div><div class="two"><div class="card"><h2>Басқару моделі</h2><p class="focus">Нормативтік талап → орынбасар тексеруі → директордың тапсырмасы → түзету → директордың қайта бақылауы.</p><p class="muted small">Нақты нормативтік сәйкестікті платформа автоматты түрде дәлелдемейді. Демо жауапты тұлғалардың шешімін көрсетеді.</p></div><div class="card"><h2>Жылдам бастау</h2><p>Алдымен «Оқу ісі орынбасары» рөлінде екі құжаттың чек-парағын қарап шығыңыз. Кейін «Директор» рөліне ауысып, түзету тапсырмаларын беріңіз.</p><div class="actions"><button class="btn primary" onclick="setPage('documents')">Тексеруге өту</button><button class="btn" onclick="setPage('guide')">Көрсету сценарийі</button></div></div></div>`}
function documents(){const k=s.selected,d=docs[k],r=s.review[k],t=s.tasks[k];return `<div class="steps"><span class="step current">1. Талап</span><span class="step">2. Чек-парақ</span><span class="step">3. Сәйкессіздік</span><span class="step">4. Түзету</span><span class="step">5. Қайта бақылау</span></div><div class="card"><div class="row"><h2>Оқу-әдістемелік жұмыс · Демонстрациялық құжат</h2><div>${badge(k)}</div></div><div class="actions">${Object.keys(docs).map(x=>`<button class="btn ${k===x?'primary':''}" onclick="choose('${x}')">${docs[x].name}</button>`).join('')}</div><div class="note"><b>6-қосымшадағы тексеру нысаны:</b> ${d.source}<br><b>Нормативтік бағдар:</b> ${d.authority}</div><div class="warn"><b>Назар аударыңыз:</b> төмендегі сандар мен қателер — тек конкурсқа арналған ойдан құрастырылған жағдай. ЖОЖ-ның шынайы нормативтік дұрыстығы мектеп түрі, оқу жылы және жоспар нұсқасы бойынша жеке анықталады.</div></div><div class="two"><div class="card"><h2>Құжат ішіндегі үлгілік деректер</h2><div class="preview"><div class="row"><b>${d.name}</b><span class="pill">DEMO / ҮЛГІ</span></div><p class="small muted">Шартты «Үлгі мектебі» · 2026–2027 оқу жылы</p><table><tr><th>Сынып</th><th>Көрсеткіш</th><th>Жоспардағы мән</th><th>Салыстырылатын мән</th><th>Нәтиже</th></tr>${d.rows.map(x=>`<tr>${x.map(y=>`<td>${escapeHTML(y)}</td>`).join('')}</tr>`).join('')}</table></div><div class="bad" style="margin-top:14px"><b>Әдейі енгізілген қате:</b><p>${d.issue}</p></div></div><div class="card"><h2>Орынбасардың чек-парағы</h2><p class="muted small">Әр тармақтың тексерілгенін белгілеңіз. Белгі қою — нақты талапқа сәйкестіктің автоматты дәлелі емес.</p>${d.checks.map((x,i)=>`<div class="item"><input type="checkbox" ${r.checks[i]?'checked':''} ${s.role==='director'?'disabled':''} onchange="check('${k}',${i},this.checked)"><label><b>${escapeHTML(x)}</b><small>${i===2||i===3?'Тиісті мәліметтерді нақты құжаттармен салыстырып тексеру қажет.':'Растайтын құжаттың мазмұны қаралуы тиіс.'}</small></label></div>`).join('')}<label class="field">Ескертпе / тексеру нәтижесі</label><textarea oninput="setNote('${k}',this.value)" ${s.role==='director'?'disabled':''}>${escapeHTML(r.note)}</textarea><div class="actions"><button class="btn primary" onclick="review('${k}')" ${s.role==='director'?'disabled':''}>Чек нәтижесін тіркеу</button></div><p class="call">Тексеру нәтижесі маршруттық парақта көрінеді.</p></div></div>${t?`<div class="card"><h2>Түзету тапсырмасы</h2><div class="note"><b>Мерзім:</b> ${t.deadline} · <b>Тапсырма:</b> ${escapeHTML(t.text)}</div>${t.state==='assigned'&&s.role==='deputy'?`<label class="field">Не түзетілді? Қай дәлелдемемен расталады?</label><textarea id="fix${k}" placeholder="Мысалы: ЖОЖ мен сабақ кестесін салыстыру актісі түзетілді, файл: ..."></textarea><div class="actions"><button class="btn primary" onclick="submitFix('${k}')">Түзету есебін директорға жіберу</button></div>`:t.comment?`<div class="good"><b>Орынбасар түсіндірмесі:</b> ${escapeHTML(t.comment)}</div>`:''}${t.directorComment?`<div class="note"><b>Директор қорытындысы:</b> ${escapeHTML(t.directorComment)}</div>`:''}</div>`:''}`}
function route(){return `<div class="card"><h2>Маршруттық парақ</h2><p class="muted">Оқу ісі жөніндегі орынбасардың екі құжатына қатысты тапсырмалар. Тапсырма беру құқығы — директорда.</p><table class="table"><tr><th>Құжат</th><th>Жауапты</th><th>Тапсырма</th><th>Мерзімі</th><th>Жағдайы</th></tr>${Object.keys(docs).map(k=>{let t=s.tasks[k];return `<tr><td>${docs[k].name}</td><td>Оқу ісі орынбасары</td><td>${t?escapeHTML(t.text):'<span class="muted">Әзірге берілмеген</span>'}</td><td>${t?t.deadline:'—'}</td><td>${badge(k)}</td></tr>`}).join('')}</table></div><div class="card"><h2>Жұмыс реті</h2><div class="note">1. Орынбасар құжаттағы сәйкессіздікті тіркейді → 2. Директор түзету тапсырмасын береді → 3. Орынбасар түзетілгенін дәлелдейді → 4. Директор қайта тексеріп, шешім қабылдайды.</div></div>`}
function director(){return `<div class="card"><div class="row"><h2>Директордың бақылау және шешім қабылдау панелі</h2><span class="pill">Белсенді рөл: ${s.role==='director'?'Директор':'Оқу ісі орынбасары'}</span></div><p class="muted">Тапсырма мен қорытындыны тек директор рөлінде тіркеуге болады. Демо рөлдер бір браузерде ауыстырылады.</p></div>${Object.keys(docs).map(k=>{let t=s.tasks[k];return `<div class="card"><div class="row"><h2>${docs[k].name}</h2>${badge(k)}</div><div class="bad"><b>Анықталған мәселе:</b> ${docs[k].issue}</div><p><b>Орынбасар ескертпесі:</b> ${escapeHTML(s.review[k].note)}</p>${!t?`<label class="field">Түзету тапсырмасы</label><textarea id="task${k}" ${s.role!=='director'?'disabled':''}>${docs[k].task}</textarea><div class="two"><div><label class="field">Орындау мерзімі</label><input type="date" id="date${k}" ${s.role!=='director'?'disabled':''}></div><div style="align-self:end"><button class="btn primary" onclick="taskCreate('${k}')" ${s.role!=='director'?'disabled':''}>Орынбасарға тапсырма беру</button></div></div>`:`<div class="note"><b>Тапсырма:</b> ${escapeHTML(t.text)}<br><b>Мерзім:</b> ${t.deadline}<br><b>Мәртебе:</b> ${t.state==='approved'?'Бекітілген':t.state==='submitted'?'Тексеруді күтеді':'Орындалуда'}</div>${t.comment?`<div class="good"><b>Орынбасардың түзету есебі:</b> ${escapeHTML(t.comment)}</div>`:''}${t.state==='submitted'?`<label class="field">Директордың қайта тексеру қорытындысы</label><textarea id="decision${k}" ${s.role!=='director'?'disabled':''} placeholder="Мысалы: жаңартылған құжаттың көрсеткіштері мен дәлелдемелері қайта салыстырылды..."></textarea><div class="actions"><button class="btn primary" ${s.role!=='director'?'disabled':''} onclick="decision('${k}',true)">Мақұлдау ✓</button><button class="btn danger" ${s.role!=='director'?'disabled':''} onclick="decision('${k}',false)">Қайта түзетуге жіберу</button></div>`:''}${t.directorComment?`<div class="note">Директор қорытындысы: ${escapeHTML(t.directorComment)}</div>`:''}`}</div>`}).join('')}`}
function report(){return `<div class="grid"><div class="card"><div class="muted">Жалпы дайындық</div><div class="metric">${percent()}%</div><div class="bar"><div class="fill" style="width:${percent()}%"></div></div></div><div class="card"><div class="muted">Бақылаудағы құжат</div><div class="metric">2</div></div><div class="card"><div class="muted">Директор бекіткен</div><div class="metric">${Object.values(s.tasks).filter(x=>x.state==='approved').length}</div></div></div><div class="card" id="printReport"><h2>School Navigator · өзін-өзі бақылаудың демо-есебі</h2><p>Оқу жылы: 2026–2027 · Модуль: Оқу-әдістемелік жұмыс · Мәліметтер: оқу үлгісі</p><table class="table"><tr><th>Құжат</th><th>Тексеру</th><th>Тапсырма</th><th>Директор қорытындысы</th></tr>${Object.keys(docs).map(k=>`<tr><td>${docs[k].name}</td><td>${badge(k)}</td><td>${escapeHTML(s.tasks[k]?.text||'Берілмеген')}</td><td>${escapeHTML(s.tasks[k]?.directorComment||'Әзірге жоқ')}</td></tr>`).join('')}</table><h3>Әрекеттер журналы</h3>${s.history.slice(0,15).map(h=>`<div class="item"><span class="small muted">${escapeHTML(h.at)}</span><span>${escapeHTML(h.text)}</span></div>`).join('')}<p class="small muted">Бұл ресми өзін-өзі бағалау қорытындысы емес; конкурс үшін жасалған оқу прототипі.</p></div><div class="actions noprint"><button class="btn primary" onclick="window.print()">Есепті басып шығару / PDF</button><button class="btn" onclick="exportCSV()">CSV жүктеу</button><button class="btn danger" onclick="reset()">Демоны бастапқы қалпына келтіру</button></div>`}
function exportCSV(){let rows=[['Құжат','Мәртебе','Чек орындалды','Тапсырма','Мерзім','Директор қорытындысы'],...Object.keys(docs).map(k=>[docs[k].name,stateLabel(k),s.review[k].checks.filter(Boolean).length+'/4',s.tasks[k]?.text||'',s.tasks[k]?.deadline||'',s.tasks[k]?.directorComment||''])];let data='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));a.download='school_navigator_demo_esep.csv';a.click();URL.revokeObjectURL(a.href)}
function guide(){return `<div class="card"><h2>Қазыларға 3–4 минутта көрсетілетін сценарий</h2><table class="table"><tr><th>Уақыт</th><th>Көрсету әрекеті</th><th>Басқарушылық нәтиже</th></tr><tr><td>0:00–0:40</td><td>Басқару панелінде екі құжаттың бастапқы мәртебесін ашыңыз.</td><td>Директор дайындықтағы тәуекелді көреді.</td></tr><tr><td>0:40–1:30</td><td>Орынбасар рөлінде «Құжаттарды тексеру» ішінен ЖОЖ бен кестені ашыңыз; әдейі берілген сәйкессіздікті түсіндіріңіз.</td><td>Нормативтік тексеру логикасы көрсетіледі.</td></tr><tr><td>1:30–2:15</td><td>«Директор» рөліне ауысып, екі құжатқа түзету тапсырмасын және мерзімін беріңіз.</td><td>Жауапкершілік пен орындау маршруты белгіленеді.</td></tr><tr><td>2:15–3:00</td><td>«Орынбасар» рөлінде түзету есебін жіберіңіз.</td><td>Орындау дәлелдемесі тіркеледі.</td></tr><tr><td>3:00–3:40</td><td>«Директор» рөліне қайта ауысып, қорытынды беріңіз де есепке кіріңіз.</td><td>Бақылау циклі жабылып, дайындық пайызы өзгереді.</td></tr></table></div><div class="card"><h2>Конкурстық қорғаудағы негізгі тезис</h2><p class="focus"><b>«School Navigator» — нормативтік құжатты тек жинайтын қойма емес, директорға сәйкессіздікті анықтап, жауапты тұлғаға түзету жүктеп, оның орындалуын қайта тексеруге мүмкіндік беретін цифрлық басқару алгоритмі.</b></p><p class="call">Нормативтік негіз: пайдаланушы ұсынған 6-қосымшаның «Оқу-әдістемелік жұмыс» бөлімі және 2026 жылғы №114-НҚ ережесі. Демодағы сандық мәліметтер, сынып көрсеткіштері мен түзету оқиғалары — ойдан құрастырылған.</p><div class="actions"><button class="btn primary" onclick="setRole('deputy');setPage('documents')">Көрсетуді бастау</button><button class="btn danger" onclick="reset()">Демонстрацияны қайта бастау</button></div></div>`}
const DEMO_GUIDE=[
{title:'1/5 — Орынбасар құжаттарды салыстырады',detail:'Оқу ісі жөніндегі орынбасар рөлінде «Құжаттарды тексеру» беті ашылады. «Жұмыс оқу жоспары» және «Сабақ кестесі» арасындағы әдейі енгізілген айырмашылықтарды көрсетіңіз.',role:'deputy',page:'documents',selected:'plan'},
{title:'2/5 — Сәйкессіздік тіркеледі',detail:'Алдымен жұмыс оқу жоспарындағы 7А сыныбына қатысты шартты +1 сағат айырманы көрсетіңіз. Содан кейін «Сабақ кестесі» батырмасын басып, көрсетілмеген электив сағатты қараңыз. Чек нәтижесін тіркеуге болады.',role:'deputy',page:'documents',selected:'schedule'},
{title:'3/5 — Директор түзету тапсырмасын береді',detail:'Директор рөлімен екі құжаттың әрқайсысына түзету тапсырмасын және орындау мерзімін белгілеңіз. «Орынбасарға тапсырма беру» батырмаларын басыңыз.',role:'director',page:'director',selected:'plan'},
{title:'4/5 — Орынбасар түзету дәлелін ұсынады',detail:'«Құжаттарды тексеру» ішінен тапсырмасы бар құжатты ашыңыз. «Не түзетілді?» алаңына түсіндірме енгізіп, «Түзету есебін директорға жіберу» батырмасын басыңыз. Екі құжат үшін қайталаңыз.',role:'deputy',page:'documents',selected:'plan'},
{title:'5/5 — Директор қайта тексеріп, нәтижесін бекітеді',detail:'«Директор бақылауы» бетінде түзету бойынша түсіндірмені қарап, екі құжатқа қорытынды енгізіп, «Мақұлдау» батырмасын басыңыз. Соңынан «Есеп және экспорт» бетінен дайындық нәтижесін шығарыңыз.',role:'director',page:'director',selected:'plan'}
];
let guidedStep=0;
function guideMove(delta){guidedStep=Math.max(0,Math.min(DEMO_GUIDE.length-1,guidedStep+delta));let step=DEMO_GUIDE[guidedStep];s.role=step.role;s.page=step.page;s.selected=step.selected;save();render()}
function guideRender(){let root=document.getElementById('demoGuide');if(!root)return;const st=DEMO_GUIDE[guidedStep];root.innerHTML=`<div class="row"><div><div class="gtitle">🎓 Конкурста көрсетудің дайын маршруты · ${st.title}</div><div class="gdetail">${st.detail}</div></div><span class="pill">${guidedStep+1} / 5</span></div><div class="gcontrols"><button class="ghost" onclick="guideMove(-1)" ${guidedStep===0?'disabled':''}>← Алдыңғы</button><button onclick="guideMove(1)" ${guidedStep===4?'disabled':''}>Келесі қадам →</button><button class="ghost" onclick="setPage('report')">Нәтижені көрсету</button><button class="ghost" onclick="reset();guidedStep=0;guideMove(0)">Демоны жаңарту ↻</button><span class="gsteps">Оқу жағдаяты · Директор + орынбасар</span></div><div class="gsmall">Нұсқаулықта көрсетілген іс-әрекетті экрандағы тиісті батырмалармен орындаңыз. Келесі қадам батырмасы деректерді өзі өзгертпейді.</div>`}
const originalRender=render;
render=function(){originalRender();guideRender()};

render();</script></body></html>
